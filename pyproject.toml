[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corgi"
version = "0.1.0"
description = "Deep neural network for genomic track prediction"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Corgi Development Team"}]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "torch>=2.1",
    "pyfaidx>=0.7",
    "pybigwig>=0.3.22",
    "flash-attn>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["corgi*"]

[tool.setuptools.data-files]
"corgi_data" = [
    "data/trans_regulators_final_hgnc.txt",
    "data/trans_regulators_final_ensg.txt",
]
